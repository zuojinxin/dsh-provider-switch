name: Publish to npm

# 通过 npm Trusted Publishing (OIDC) 发布：不需要 npm token，也不需要 2FA 验证码。
# 触发方式：推送 v* 标签，或在 GitHub 上手动点 Run workflow。
#
# 前置条件（在 npmjs.com 上配置一次）：
#   包页面 → Settings → Trusted publishers → Add trusted publisher
#   Organization/Account: zuojinxin
#   Repository:           dsh-provider-switch
#   Workflow file:        publish.yml
#   Environment:          留空

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 必需：让 npm 用 Actions 身份换取发布令牌
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # runner 自带的 npm 版本不支持 OIDC，必须升到最新
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --provenance --access public
